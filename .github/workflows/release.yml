name: release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Guile
        run: sudo apt-get update && sudo apt-get install -y guile-3.0

      - name: Run smoke test
        run: make test

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            shae-scheme-tiny-interpreter ${{ github.ref_name }}

            A tiny Scheme interpreter (R5RS/R7RS style) written in Scheme.

            ## Usage

            ```bash
            guile src/interpreter.scm
            ```

            ## Features

            - REPL with `scheme> ` prompt
            - Arithmetic: `+ - * /`
            - Comparison: `= < >`
            - `cons`, `car`, `cdr`, `list`, `quote`
            - `eval`, `apply`
            - `define`, `lambda`, `let`, `if`, `cond`
            - Basic error handling
          generate_release_notes: false
